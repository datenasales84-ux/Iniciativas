// Função para buscar estudantes por escola, ano e turma
function getEstudantes(escola, ano, turma) {
  if (!escola || !ano || !turma) return [];
  const chave = `${ano}|${turma}`;
  return (DADOS_ESCOLAS[escola] && DADOS_ESCOLAS[escola][chave]) ? DADOS_ESCOLAS[escola][chave] : [];
}

/* ── Sistema Principal ── */
const AlertasContext = React.createContext({alertas:[], addAlerta:()=>{}, limparAlerta:()=>{}});

function App() {
  const [tab, setTab] = useState("freq");
  const [alertas, setAlertas] = useState([]); // [{id, estudante, escola, ano, turma, faltas, data}]

  const addAlerta = (info) => {
    setAlertas(prev => {
      const existe = prev.find(a => a.estudante === info.estudante && a.chave === info.chave);
      if (existe) return prev.map(a => a.estudante===info.estudante && a.chave===info.chave ? {...a, faltas:info.faltas, data:info.data} : a);
      return [{id:Date.now(), ...info}, ...prev];
    });
  };

  const limparAlerta = (id) => setAlertas(prev => prev.filter(a => a.id !== id));
  const totalAlertas = alertas.length;

  return (
    <AlertasContext.Provider value={{alertas, addAlerta, limparAlerta}}>
    <div style={{minHeight:"100vh",background:"#071525"}}>
      {/* HEADER */}
      <div style={{background:"#050e1a",borderBottom:"1px solid #1a3a5c",padding:"12px 20px",position:"sticky",top:0,zIndex:99,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:14,fontWeight:900,color:"#38bdf8",letterSpacing:1}}>AÊ PARENTE</div>
          <div style={{fontSize:11,color:"#5a9fc5",letterSpacing:1,textTransform:"uppercase",marginTop:2}}>Um olho na frequência e outro na aprendizagem</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          {totalAlertas > 0 && (
            <div onClick={()=>setTab("alertas")} style={{cursor:"pointer",background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.4)",borderRadius:20,padding:"4px 12px",display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:"#ef4444",display:"inline-block",animation:"pulse 2s infinite"}}></span>
              <span style={{fontSize:12,fontWeight:800,color:"#fca5a5"}}>{totalAlertas} alerta{totalAlertas>1?"s":""}</span>
            </div>
          )}
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:"#3a6a8a"}}>Data</div>
            <div style={{fontSize:12,color:"#38bdf8",fontWeight:700,fontFamily:"monospace"}}>{hoje}</div>
          </div>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",gap:4,padding:"12px 20px 0",flexWrap:"wrap"}}>
        {[
          ["freq",     "📋 Frequência"],
          ["busca",    "🔍 Busca Ativa"],
          ["docente",  "👩‍🏫 Docentes"],
          ["hist",     "📊 Histórico"],
          ["alertas",  totalAlertas>0 ? `🔴 Alertas (${totalAlertas})` : "🔔 Alertas"],
        ].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{
            padding:"9px 14px",borderRadius:8,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",
            background: k==="alertas" && totalAlertas>0 ? "rgba(239,68,68,.2)" : tab===k?"#1560a8":"#0f2035",
            color: k==="alertas" && totalAlertas>0 ? "#fca5a5" : tab===k?"#fff":"#4a7fa5",
            borderBottom: tab===k ? "2px solid #38bdf8" : k==="alertas" && totalAlertas>0 ? "2px solid #ef4444" : "2px solid transparent"
          }}>{l}</button>
        ))}
      </div>

      <div style={{padding:"16px 20px",maxWidth:900,margin:"0 auto"}}>
        {tab==="freq"    && <TabFrequencia />}
        {tab==="busca"   && <TabBuscaAtiva />}
        {tab==="docente" && <TabDocentes />}
        {tab==="hist"    && <TabHistorico />}
        {tab==="alertas" && <TabAlertas />}
      </div>
    </div>
    </AlertasContext.Provider>
  );
}

function TabFrequencia() {
  const {addAlerta} = React.useContext(AlertasContext);
  const [escola,   setEscola]   = useState("");
  const [turno,    setTurno]    = useState("");
  const [ano,      setAno]      = useState("");
  const [turma,    setTurma]    = useState("");
  const [freq,     setFreq]     = useState({});
  const [justif,   setJustif]   = useState({});
  const [anexos,   setAnexos]   = useState({});
  const [erros,    setErros]    = useState({});
  const [modal,    setModal]    = useState(null);
  const [modalTxt, setModalTxt] = useState("");
  const [modalArq, setModalArq] = useState(null);
  const [salvo,    setSalvo]    = useState(false);
  const [registros,setRegistros]= useState([]);
  const [buscaEstudante, setBuscaEstudante] = useState("");
  const [extrasEstudantes, setExtrasEstudantes] = useState({});
  const [novoEstudante, setNovoEstudante] = useState("");
  const fileRef = useRef();

  const chave = ano && turma ? `${ano}|${turma}` : null;
  const fixos = (escola && ano && turma) ? getEstudantes(escola, ano, turma) : [];
  const extras = chave ? (extrasEstudantes[chave+(escola||"")] || []) : [];
  const estudantes = [...fixos, ...extras];
  const ausentes  = estudantes.filter(e => freq[`${chave}|${e}`] === "falta");
  const presentes = estudantes.length - ausentes.length;
  const pct = estudantes.length > 0 ? ((ausentes.length/estudantes.length)*100).toFixed(1) : "0.0";

  const addEstudante = () => {
    const n = novoEstudante.trim();
    if (!n || !chave) return;
    if (estudantes.includes(n)) return;
    const keyEscola = chave+(escola||"");
    setExtrasEstudantes(p=>({...p,[keyEscola]:[...(p[keyEscola]||[]),n]}));
    setNovoEstudante("");
  };

  const remEstudante = (nome) => {
    if (!chave) return;
    const keyEscola = chave+(escola||"");
    setExtrasEstudantes(p=>({...p,[keyEscola]:(p[keyEscola]||[]).filter(x=>x!==nome)}));
  };

  const toggleFreq = (nome) => {
    const k = `${chave}|${nome}`;
    setFreq(prev => {
      const novoEstado = prev[k]==="falta" ? "presente" : "falta";
      const novaFreq = {...prev, [k]: novoEstado};
      if (novoEstado === "falta") {
        const contFaltas = Object.entries(novaFreq).filter(([kk,v]) => kk.endsWith(`|${nome}`) && v==="falta").length;
        if (contFaltas >= 2) {
          addAlerta({estudante:nome, escola, ano, turma, turno, chave, faltas:contFaltas, data:hoje});
        }
      }
      return novaFreq;
    });
  };

  const salvar = () => {
    const e = {};
    if (!escola)           e.escola  = "Selecione a escola";
    if (!turno)            e.turno   = "Selecione o turno";
    if (!ano)              e.ano     = "Selecione o ano";
    if (!turma)            e.turma   = "Selecione a turma";
    if (estudantes.length===0) e.estudantes = "Esta turma não possui estudantes cadastrados";
    setErros(e);
    if (Object.keys(e).length>0) return;
    const reg = {id:Date.now(),data:hoje,escola,inep:ESCOLAS.find(x=>x.nome===escola)?.inep||"",turno,ano,turma,estudantes:[...estudantes],freq:{...freq},justif:{...justif},chave};
    setRegistros(p=>[reg,...p]);
    setSalvo(true);
    setTimeout(()=>setSalvo(false),2500);
  };

  const escolaObj = ESCOLAS.find(x=>x.nome===escola);

  return (
    <div className="fade">
      {/* Identificação */}
      <div style={card}>
        <span style={slbl}>Identificação</span>
        <div style={{marginBottom:12}}>
          <span style={lbl}>Escola <span style={{color:"#f87171"}}>*</span></span>
          <select style={sel(erros.escola)} value={escola} onChange={e=>{setEscola(e.target.value);setErros(p=>({...p,escola:null}))}}>
            <option value="">Selecionar escola...</option>
            {ESCOLAS.map(e=><option key={e.inep} value={e.nome}>{e.nome} — INEP: {e.inep}</option>)}
          </select>
          {escolaObj && <div style={{fontSize:11,color:"#38bdf8",marginTop:4}}>🏫 INEP: <strong>{escolaObj.inep}</strong></div>}
          {errMsg(erros.escola)}
        </div>
        <div style={{marginBottom:14}}>
          <span style={lbl}>Estudante</span>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp(),flex:1}} placeholder="Nome completo do estudante..." value={novoEstudante} onChange={e=>setNovoEstudante(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEstudante()} />
            <button style={btnBlue} onClick={addEstudante}>+ Add</button>
          </div>
          {erros.estudantes && <div style={{fontSize:11,color:"#f87171",marginTop:4}}>⚠ {erros.estudantes}</div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>
            <span style={lbl}>Turno <span style={{color:"#f87171"}}>*</span></span>
            <select style={sel(erros.turno)} value={turno} onChange={e=>{setTurno(e.target.value);setErros(p=>({...p,turno:null}))}}>
              <option value="">Selecionar...</option>
              {TURNOS.map(t=><option key={t}>{t}</option>)}
            </select>
            {errMsg(erros.turno)}
          </div>
          <div>
            <span style={lbl}>Ano <span style={{color:"#f87171"}}>*</span></span>
            <select style={sel(erros.ano)} value={ano} onChange={e=>{setAno(e.target.value);setTurma("");setErros(p=>({...p,ano:null}))}}>
              <option value="">Selecionar...</option>
              {ANOS.map(a=><option key={a}>{a}</option>)}
            </select>
            {errMsg(erros.ano)}
          </div>
        </div>
        <span style={lbl}>Turma <span style={{color:"#f87171"}}>*</span></span>
        <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}>
          {TURMAS.map(t=>(
            <button key={t} onClick={()=>{if(ano){setTurma(p=>p===t?"":t);setErros(p=>({...p,turma:null}))}}} style={{
              flex:1,minWidth:36,padding:"10px 0",borderRadius:8,fontSize:16,fontWeight:900,cursor:ano?"pointer":"not-allowed",fontFamily:"monospace",
              border:turma===t?"2px solid #38bdf8":`1.5px solid ${erros.turma?"#f87171":"#1a3a5c"}`,
              background:turma===t?"#1560a8":"#0b1a2e",color:turma===t?"#fff":ano?"#7dd3fc":"#223a52"
            }}>{t}</button>
          ))}
        </div>
        {!ano && <div style={{fontSize:11,color:"#3a6a8a",marginTop:4}}>Selecione o ano primeiro</div>}
        {errMsg(erros.turma)}
      </div>

      {/* Resumo da escola selecionada */}
      {escola && !turma && DADOS_ESCOLAS[escola] && (
        <div style={{...card,marginBottom:14}}>
          <div style={{fontSize:10,color:"#3a7fa5",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Turmas disponíveis — {escola}</div>
          {ANOS.map(a => {
            const turmasComEstudantes = TURMAS.filter(t => {
              const lista = getEstudantes(escola, a, t);
              return lista.length > 0;
            });
            if (turmasComEstudantes.length === 0) return null;
            return (
              <div key={a} style={{marginBottom:8}}>
                <div style={{fontSize:12,color:"#7dd3fc",fontWeight:700,marginBottom:4}}>{a}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {turmasComEstudantes.map(t => {
                    const qtd = getEstudantes(escola, a, t).length;
                    return (
                      <div key={t} onClick={()=>{setAno(a);setTurma(t);}} style={{background:"rgba(56,189,248,.1)",border:"1px solid rgba(56,189,248,.25)",borderRadius:8,padding:"6px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:13,fontWeight:900,color:"#38bdf8",fontFamily:"monospace"}}>Turma {t}</span>
                        <span style={{fontSize:11,color:"#4a7fa5"}}>{qtd} estudantes</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Contador */}
      {estudantes.length>0 && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
          {[[presentes,"#4ade80","Presentes"],[ausentes.length,"#f87171","Ausentes"],[pct+"%",ausentes.length>0?"#fbbf24":"#4ade80","Ausência"]].map(([v,c,l])=>(
            <div key={l} style={{background:"#0b1a2e",border:"1px solid #1a3a5c",borderRadius:10,padding:"12px",textAlign:"center"}}>
              <div style={{fontSize:26,fontWeight:900,color:c,fontFamily:"monospace"}}>{v}</div>
              <div style={{fontSize:9,color:"#4a7fa5",textTransform:"uppercase",letterSpacing:1,marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
      )}

      {/* Lista de estudantes */}
      {chave && estudantes.length>0 && (
        <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"11px 16px",borderBottom:"1px solid #1a3a5c",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontWeight:800,fontSize:13}}>{ano} — Turma {turma} • {turno}</span>
            <span style={badge("rgba(56,189,248,.12)","#7dd3fc","rgba(56,189,248,.25)")}>{estudantes.length} estudantes</span>
          </div>
          <div style={{padding:"8px 14px",borderBottom:"1px solid #1a3a5c"}}>
            <input style={{...inp(),fontSize:12,padding:"7px 10px"}} placeholder="🔎 Buscar estudante..." value={buscaEstudante} onChange={e=>setBuscaEstudante(e.target.value)} />
          </div>
          {estudantes.filter(n=>n.toLowerCase().includes(buscaEstudante.toLowerCase())).map((nome,i,arr)=>{
            const k=`${chave}|${nome}`;
            const falta=freq[k]==="falta";
            const jt=justif[k];
            const anx=anexos[k];
            const num=estudantes.indexOf(nome)+1;
            return(
              <div key={nome} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:falta?"rgba(220,38,38,.05)":"transparent",borderBottom:i<arr.length-1?"1px solid #0a1828":"none",transition:"background .15s"}}>
                <div style={{width:26,fontSize:11,color:"#3a6a8a",fontFamily:"monospace",flexShrink:0,textAlign:"right"}}>{num}.</div>
                <div style={{width:32,height:32,borderRadius:"50%",background:falta?"rgba(239,68,68,.25)":"rgba(34,197,94,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,color:falta?"#fca5a5":"#86efac",flexShrink:0}}>
                  {nome.charAt(0).toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:falta?"#fca5a5":"#e2f0fb",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nome}</div>
                  <div style={{display:"flex",gap:6,marginTop:2,flexWrap:"wrap"}}>
                    {jt && <span style={{fontSize:10,color:"#fbbf24"}}>📝 {jt}</span>}
                    {anx && <span style={{fontSize:10,color:"#a78bfa"}}>📎 {anx.nome}</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  {falta && <>
                    <button onClick={()=>{setModal({nome,k,tipo:"justif"});setModalTxt(justif[k]||"")}} style={{background:"rgba(245,158,11,.15)",border:"1px solid rgba(245,158,11,.3)",color:"#fbbf24",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:700}}>Justif.</button>
                    <button onClick={()=>{setModal({nome,k,tipo:"anexo"});setModalArq(anexos[k]||null)}} style={{background:"rgba(167,139,250,.15)",border:"1px solid rgba(167,139,250,.3)",color:"#a78bfa",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:700}}>📎</button>
                  </>}
                  <button onClick={()=>toggleFreq(nome)} style={{background:falta?"rgba(239,68,68,.2)":"rgba(34,197,94,.15)",border:`1px solid ${falta?"rgba(239,68,68,.4)":"rgba(34,197,94,.3)"}`,color:falta?"#fca5a5":"#86efac",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:800,cursor:"pointer",minWidth:78}}>
                    {falta?"✗ FALTA":"✓ PRES."}
                  </button>
                  {extras.includes(nome) && (
                    <button onClick={()=>remEstudante(nome)} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#fca5a5",borderRadius:6,padding:"4px 7px",fontSize:12,cursor:"pointer"}}>✕</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {chave && estudantes.length===0 && (
        <div style={{textAlign:"center",padding:"30px 20px",color:"#4a7fa5"}}>
          <div style={{fontSize:32,marginBottom:6}}>👨‍🎓</div>
          <div style={{fontWeight:700,fontSize:13}}>Nenhum estudante nesta turma ainda</div>
          <div style={{fontSize:11,marginTop:4}}>Adicione pelo campo Estudante acima</div>
        </div>
      )}

      {!chave && (
        <div style={{textAlign:"center",padding:"50px 20px",color:"#4a7fa5"}}>
          <div style={{fontSize:40,marginBottom:10}}>🏫</div>
          <div style={{fontWeight:700}}>Selecione escola, turno, ano e turma</div>
        </div>
      )}

      {/* Ausentes em destaque */}
      {ausentes.length>0 && (
        <div style={{background:"rgba(220,38,38,.07)",border:"1px solid rgba(220,38,38,.25)",borderRadius:10,padding:14,marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#ef4444",display:"inline-block",animation:"pulse 2s infinite"}}></span>
            <span style={{fontSize:12,fontWeight:800,color:"#fca5a5",textTransform:"uppercase",letterSpacing:1}}>Estudantes Ausentes ({ausentes.length})</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {ausentes.map(n=><span key={n} style={badge("rgba(239,68,68,.15)","#fca5a5","rgba(239,68,68,.3)")}>{justif[`${chave}|${n}`]?"📝 ":""}{anexos[`${chave}|${n}`]?"📎 ":""}{n}</span>)}
          </div>
        </div>
      )}

      {/* Erros gerais */}
      {Object.values(erros).some(Boolean) && (
        <div style={{background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.3)",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:12,color:"#fca5a5"}}>
          ⚠ Preencha todos os campos obrigatórios antes de salvar.
        </div>
      )}

      <button style={{...btnFull,opacity:(!escola||!turno||!ano||!turma||estudantes.length===0)?0.5:1}} onClick={salvar}>
        {salvo?"✓ Frequência Salva com Sucesso!":"💾 Salvar Registro do Dia"}
      </button>

      {/* Modal Justificativa / Anexo */}
      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}} onClick={()=>setModal(null)}>
          <div style={{background:"#0f2035",border:"1.5px solid #1a3a5c",borderRadius:14,padding:24,width:"100%",maxWidth:440}} onClick={e=>e.stopPropagation()}>
            {modal.tipo==="justif" ? <>
              <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>Justificativa de Falta</div>
              <div style={{fontSize:12,color:"#4a7fa5",marginBottom:14}}>Estudante: <strong style={{color:"#e2f0fb"}}>{modal.nome}</strong></div>
              <textarea style={{background:"#071525",border:"1.5px solid #1a3a5c",color:"#e2f0fb",borderRadius:8,padding:10,width:"100%",fontSize:13,resize:"vertical",outline:"none",minHeight:90}} placeholder="Descreva o motivo da ausência..." value={modalTxt} onChange={e=>setModalTxt(e.target.value)} />
              <div style={{display:"flex",gap:10,marginTop:14}}>
                <button style={{...btnGhost,flex:1}} onClick={()=>setModal(null)}>Cancelar</button>
                <button style={{...btnBlue,flex:2}} onClick={()=>{setJustif(p=>({...p,[modal.k]:modalTxt}));setModal(null)}}>Salvar Justificativa</button>
              </div>
            </> : <>
              <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>📎 Evidência / Anexo</div>
              <div style={{fontSize:12,color:"#4a7fa5",marginBottom:14}}>Estudante: <strong style={{color:"#e2f0fb"}}>{modal.nome}</strong></div>
              <div style={{border:"2px dashed #1a3a5c",borderRadius:10,padding:20,textAlign:"center",marginBottom:14,cursor:"pointer",background:"#071525"}} onClick={()=>fileRef.current.click()}>
                {modalArq ? (
                  <div>
                    <div style={{fontSize:28,marginBottom:6}}>📄</div>
                    <div style={{fontSize:13,color:"#a78bfa",fontWeight:700}}>{modalArq.nome}</div>
                    <div style={{fontSize:11,color:"#4a7fa5",marginTop:4}}>{modalArq.tamanho}</div>
                  </div>
                ) : (
                  <div>
                    <div style={{fontSize:28,marginBottom:6}}>📎</div>
                    <div style={{fontSize:13,color:"#4a7fa5"}}>Clique para selecionar arquivo</div>
                    <div style={{fontSize:11,color:"#3a5a75",marginTop:4}}>Foto, PDF ou documento</div>
                  </div>
                )}
              </div>
              <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>{
                const f=e.target.files[0];
                if(f) setModalArq({nome:f.name,tamanho:(f.size/1024).toFixed(1)+"KB",tipo:f.type});
              }} />
              <div style={{display:"flex",gap:10}}>
                <button style={{...btnGhost,flex:1}} onClick={()=>setModal(null)}>Cancelar</button>
                {modalArq && <button style={{background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",color:"#fca5a5",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontWeight:600,fontSize:13}} onClick={()=>{setModalArq(null)}}>Remover</button>}
                <button style={{...btnBlue,flex:2}} onClick={()=>{if(modalArq)setAnexos(p=>({...p,[modal.k]:modalArq}));setModal(null)}}>Salvar Anexo</button>
              </div>
            </>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   TAB — BUSCA ATIVA
══════════════════════════════════════════════════════════════ */
function TabBuscaAtiva() {
  const [registros, setRegistros] = useState([]);
  const [form, setForm] = useState({escola:"",ano:"",turma:"",estudante:"",responsavel:"",contato:"",endereco:"",obs:"",resultado:"",data:hoje});
  const [erros, setErros] = useState({});
  const [salvo, setSalvo] = useState(false);
  const [anexo, setAnexo] = useState(null);
  const fileRef = useRef();

  const set = (k,v) => { setForm(p=>({...p,[k]:v})); setErros(p=>({...p,[k]:null})); };

  const salvar = () => {
    const e={};
    if(!form.escola)    e.escola    ="Selecione a escola";
    if(!form.ano)       e.ano       ="Selecione o ano";
    if(!form.turma)     e.turma     ="Selecione a turma";
    if(!form.estudante.trim()) e.estudante ="Informe o nome do estudante";
    if(!form.responsavel.trim()) e.responsavel="Informe o responsável";
    if(!form.endereco.trim()) e.endereco ="Informe o endereço";
    if(!form.resultado) e.resultado ="Informe o resultado da visita";
    setErros(e);
    if(Object.keys(e).length>0) return;
    setRegistros(p=>[{id:Date.now(),...form,anexo},...p]);
    setForm({escola:"",ano:"",turma:"",estudante:"",responsavel:"",contato:"",endereco:"",obs:"",resultado:"",data:hoje});
    setAnexo(null);
    setSalvo(true);
    setTimeout(()=>setSalvo(false),2500);
  };

  return (
    <div className="fade">
      <div style={card}>
        <span style={slbl}>🔍 Registro de Busca Ativa</span>
        <div style={{display:"grid",gridTemplateColumns:"1fr",gap:12}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            <div>
              <span style={lbl}>Escola <span style={{color:"#f87171"}}>*</span></span>
              <select style={sel(erros.escola)} value={form.escola} onChange={e=>set("escola",e.target.value)}>
                <option value="">Selecionar...</option>
                {ESCOLAS.map(e=><option key={e.inep} value={e.nome}>{e.nome}</option>)}
              </select>
              {errMsg(erros.escola)}
            </div>
            <div>
              <span style={lbl}>Ano <span style={{color:"#f87171"}}>*</span></span>
              <select style={sel(erros.ano)} value={form.ano} onChange={e=>set("ano",e.target.value)}>
                <option value="">Selecionar...</option>
                {ANOS.map(a=><option key={a}>{a}</option>)}
              </select>
              {errMsg(erros.ano)}
            </div>
            <div>
              <span style={lbl}>Turma <span style={{color:"#f87171"}}>*</span></span>
              <select style={sel(erros.turma)} value={form.turma} onChange={e=>set("turma",e.target.value)}>
                <option value="">Selecionar...</option>
                {TURMAS.map(t=><option key={t}>{t}</option>)}
              </select>
              {errMsg(erros.turma)}
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div>
              <span style={lbl}>Nome do Estudante <span style={{color:"#f87171"}}>*</span></span>
              <input style={inp(erros.estudante)} placeholder="Nome completo..." value={form.estudante} onChange={e=>set("estudante",e.target.value)} />
              {errMsg(erros.estudante)}
            </div>
            <div>
              <span style={lbl}>Data da Visita</span>
              <input style={inp()} type="date" value={form.data} onChange={e=>set("data",e.target.value)} />
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div>
              <span style={lbl}>Responsável <span style={{color:"#f87171"}}>*</span></span>
              <input style={inp(erros.responsavel)} placeholder="Nome do responsável..." value={form.responsavel} onChange={e=>set("responsavel",e.target.value)} />
              {errMsg(erros.responsavel)}
            </div>
            <div>
              <span style={lbl}>Contato / Telefone</span>
              <input style={inp()} placeholder="(00) 00000-0000" value={form.contato} onChange={e=>set("contato",e.target.value)} />
            </div>
          </div>

          <div>
            <span style={lbl}>Endereço <span style={{color:"#f87171"}}>*</span></span>
            <input style={inp(erros.endereco)} placeholder="Rua, número, bairro..." value={form.endereco} onChange={e=>set("endereco",e.target.value)} />
            {errMsg(erros.endereco)}
          </div>

          <div>
            <span style={lbl}>Resultado da Visita <span style={{color:"#f87171"}}>*</span></span>
            <select style={sel(erros.resultado)} value={form.resultado} onChange={e=>set("resultado",e.target.value)}>
              <option value="">Selecionar...</option>
              <option>Estudante encontrado — retornará</option>
              <option>Estudante encontrado — não retornará</option>
              <option>Responsável contatado</option>
              <option>Ninguém encontrado</option>
              <option>Endereço não localizado</option>
              <option>Encaminhado ao Conselho Tutelar</option>
            </select>
            {errMsg(erros.resultado)}
          </div>

          {/* Anexo evidência */}
          <div>
            <span style={lbl}>📎 Evidência da Visita</span>
            <div style={{border:"2px dashed #1a3a5c",borderRadius:10,padding:16,textAlign:"center",cursor:"pointer",background:"#071525"}} onClick={()=>fileRef.current.click()}>
              {anexo ? (
                <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
                  <span style={{fontSize:22}}>📄</span>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>{anexo.nome}</div>
                    <div style={{fontSize:10,color:"#4a7fa5"}}>{anexo.tamanho}</div>
                  </div>
                  <button onClick={e=>{e.stopPropagation();setAnexo(null)}} style={{marginLeft:8,background:"rgba(239,68,68,.15)",border:"none",color:"#fca5a5",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:12}}>✕</button>
                </div>
              ) : (
                <>
                  <div style={{fontSize:22,marginBottom:4}}>📎</div>
                  <div style={{fontSize:12,color:"#4a7fa5"}}>Clique para anexar foto ou documento da visita</div>
                </>
              )}
            </div>
            <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>{ const f=e.target.files[0]; if(f) setAnexo({nome:f.name,tamanho:(f.size/1024).toFixed(1)+"KB"}); }} />
          </div>
        </div>

        <div style={{marginTop:14}}>
          <button style={btnFull} onClick={salvar}>{salvo?"✓ Busca Ativa Registrada!":"💾 Registrar Busca Ativa"}</button>
        </div>
      </div>

      {/* Lista de registros */}
      {registros.length>0 && (
        <div>
          <span style={{...slbl,marginBottom:10}}>Registros de Busca Ativa ({registros.length})</span>
          {registros.map(r=>(
            <div key={r.id} style={{...card,borderLeft:"3px solid #38bdf8"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:800,fontSize:13}}>{r.estudante}</div>
                  <div style={{fontSize:11,color:"#4a7fa5"}}>{r.escola} — {r.ano} Turma {r.turma}</div>
                </div>
                <div style={{fontSize:11,color:"#38bdf8",fontFamily:"monospace",flexShrink:0}}>{r.data}</div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:r.obs?8:0}}>
                <span style={badge("rgba(56,189,248,.12)","#7dd3fc","rgba(56,189,248,.25)")}>{r.resultado}</span>
                {r.responsavel && <span style={badge("rgba(167,139,250,.12)","#c4b5fd","rgba(167,139,250,.25)")}>👤 {r.responsavel}</span>}
                {r.contato && <span style={badge("rgba(74,222,128,.12)","#86efac","rgba(74,222,128,.25)")}>📞 {r.contato}</span>}
                {r.anexo && <span style={badge("rgba(167,139,250,.15)","#a78bfa","rgba(167,139,250,.3)")}>📎 {r.anexo.nome}</span>}
              </div>
              {r.obs && <div style={{fontSize:11,color:"#4a7fa5",marginTop:4}}>💬 {r.obs}</div>}
              {r.endereco && <div style={{fontSize:11,color:"#4a7fa5",marginTop:2}}>📍 {r.endereco}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   TAB — DOCENTES
══════════════════════════════════════════════════════════════ */
function TabDocentes() {
  const [docentes,    setDocentes]    = useState([]);
  const [novoNome,    setNovoNome]    = useState("");
  const [novoDisc,    setNovoDisc]    = useState("");
  const [freqDoc,     setFreqDoc]     = useState({});
  const [justifDoc,   setJustifDoc]   = useState({});
  const [acaoDoc,     setAcaoDoc]     = useState({});
  const [anexoDoc,    setAnexoDoc]    = useState({});
  const [modal,       setModal]       = useState(null);
  const [modalTxt,    setModalTxt]    = useState("");
  const [modalAcao,   setModalAcao]   = useState("");
  const [modalAnexo,  setModalAnexo]  = useState(null);
  const [erroNome,    setErroNome]    = useState("");
  const [estrategia,  setEstrategia]  = useState("");
  const fileRef = useRef();

  const addDocente = () => {
    if(!novoNome.trim()){setErroNome("Informe o nome do docente");return;}
    setDocentes(p=>[...p,{nome:novoNome.trim(),disc:novoDisc.trim()}]);
    setNovoNome(""); setNovoDisc(""); setErroNome("");
  };

  const ausentes = docentes.filter(d=>freqDoc[d.nome]==="ausente");

  return (
    <div className="fade">
      <div style={card}>
        <span style={slbl}>Adicionar Docente</span>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <span style={lbl}>Nome <span style={{color:"#f87171"}}>*</span></span>
            <input style={inp(erroNome)} placeholder="Nome do professor(a)..." value={novoNome} onChange={e=>{setNovoNome(e.target.value);setErroNome("")}} />
            {errMsg(erroNome)}
          </div>
          <div>
            <span style={lbl}>Disciplina / Turma</span>
            <input style={inp()} placeholder="Ex: Matemática — 6ºA" value={novoDisc} onChange={e=>setNovoDisc(e.target.value)} />
          </div>
        </div>
        <button style={btnFull} onClick={addDocente}>+ Adicionar Docente</button>
      </div>

      <div style={card}>
        <span style={slbl}>Observações / Estratégia realizada pela equipe gestora para o atendimento das turmas</span>
        <textarea style={{...inp(),resize:"vertical",minHeight:90}} placeholder="Descreva a estratégia e observações da equipe gestora..." value={estrategia} onChange={e=>setEstrategia(e.target.value)} />
      </div>

      {docentes.length===0 ? (
        <div style={{textAlign:"center",padding:"40px 20px",color:"#4a7fa5"}}>
          <div style={{fontSize:36,marginBottom:8}}>👩‍🏫</div>
          <div>Nenhum docente cadastrado</div>
        </div>
      ) : (
        <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"11px 16px",borderBottom:"1px solid #1a3a5c"}}>
            <span style={{fontWeight:800,fontSize:13}}>Controle de Docentes — {hoje}</span>
          </div>
          {docentes.map((d,i)=>{
            const ausente=freqDoc[d.nome]==="ausente";
            return(
              <div key={d.nome} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 14px",background:ausente?"rgba(245,158,11,.04)":"transparent",borderBottom:i<docentes.length-1?"1px solid #0a1828":"none"}}>
                <div style={{width:34,height:34,borderRadius:8,background:ausente?"rgba(245,158,11,.2)":"rgba(56,189,248,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>👩‍🏫</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:ausente?"#fbbf24":"#e2f0fb"}}>{d.nome}</div>
                  {d.disc && <div style={{fontSize:11,color:"#4a7fa5"}}>{d.disc}</div>}
                  {ausente && acaoDoc[d.nome] && <div style={{fontSize:10,color:"#86efac",marginTop:2}}>✅ {acaoDoc[d.nome]}</div>}
                  {ausente && justifDoc[d.nome] && <div style={{fontSize:10,color:"#fbbf24",marginTop:1}}>📝 {justifDoc[d.nome]}</div>}
                  {ausente && anexoDoc[d.nome] && <div style={{fontSize:10,color:"#a78bfa",marginTop:1}}>📎 {anexoDoc[d.nome].nome}</div>}
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  {ausente && (
                    <button onClick={()=>{setModal(d.nome);setModalTxt(justifDoc[d.nome]||"");setModalAcao(acaoDoc[d.nome]||"");setModalAnexo(anexoDoc[d.nome]||null)}}
                      style={{background:"rgba(245,158,11,.15)",border:"1px solid rgba(245,158,11,.3)",color:"#fbbf24",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:700}}>
                      Ação
                    </button>
                  )}
                  <button onClick={()=>setFreqDoc(p=>({...p,[d.nome]:p[d.nome]==="ausente"?"presente":"ausente"}))} style={{background:ausente?"rgba(245,158,11,.2)":"rgba(34,197,94,.12)",border:`1px solid ${ausente?"rgba(245,158,11,.4)":"rgba(34,197,94,.3)"}`,color:ausente?"#fbbf24":"#86efac",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:800,cursor:"pointer",minWidth:80}}>
                    {ausente?"✗ AUSENTE":"✓ PRES."}
                  </button>
                  <button onClick={()=>setDocentes(p=>p.filter(x=>x.nome!==d.nome))} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#fca5a5",borderRadius:6,padding:"4px 7px",fontSize:13,cursor:"pointer"}}>✕</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {ausentes.length>0 && (
        <div style={{background:"rgba(245,158,11,.07)",border:"1px solid rgba(245,158,11,.25)",borderRadius:10,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:"#fbbf24",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Docentes Ausentes ({ausentes.length})</div>
          {ausentes.map(d=>(
            <div key={d.nome} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={badge("rgba(245,158,11,.13)","#fbbf24","rgba(245,158,11,.3)")}>{d.nome}</span>
              {d.disc && <span style={{fontSize:11,color:"#4a7fa5"}}>{d.disc}</span>}
              {acaoDoc[d.nome] && <span style={badge("rgba(74,222,128,.1)","#86efac","rgba(74,222,128,.25)")}>{acaoDoc[d.nome]}</span>}
            </div>
          ))}
        </div>
      )}

      {/* Modal ação do professor */}
      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}} onClick={()=>setModal(null)}>
          <div style={{background:"#0f2035",border:"1.5px solid #1a3a5c",borderRadius:14,padding:24,width:"100%",maxWidth:460}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>Ação pela Falta do Docente</div>
            <div style={{fontSize:12,color:"#4a7fa5",marginBottom:16}}>Docente: <strong style={{color:"#e2f0fb"}}>{modal}</strong></div>

            <span style={lbl}>Ação tomada <span style={{color:"#f87171"}}>*</span></span>
            <select style={{...sel(),marginBottom:12}} value={modalAcao} onChange={e=>setModalAcao(e.target.value)}>
              <option value="">Selecionar ação...</option>
              {ACOES_PROF.map(a=><option key={a}>{a}</option>)}
            </select>

            <span style={lbl}>Justificativa / Observação</span>
            <textarea style={{background:"#071525",border:"1.5px solid #1a3a5c",color:"#e2f0fb",borderRadius:8,padding:10,width:"100%",fontSize:13,resize:"vertical",outline:"none",minHeight:80,marginBottom:12}} placeholder="Detalhes sobre a ausência e providências..." value={modalTxt} onChange={e=>setModalTxt(e.target.value)} />

            <span style={lbl}>📎 Evidência / Anexo</span>
            <div style={{border:"2px dashed #1a3a5c",borderRadius:8,padding:14,textAlign:"center",cursor:"pointer",background:"#071525",marginBottom:14}} onClick={()=>fileRef.current.click()}>
              {modalAnexo ? (
                <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
                  <span>📄</span>
                  <span style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>{modalAnexo.nome}</span>
                  <button onClick={e=>{e.stopPropagation();setModalAnexo(null)}} style={{background:"none",border:"none",color:"#fca5a5",cursor:"pointer",fontSize:14}}>✕</button>
                </div>
              ) : <div style={{fontSize:12,color:"#4a7fa5"}}>📎 Clique para anexar arquivo</div>}
            </div>
            <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>{ const f=e.target.files[0]; if(f) setModalAnexo({nome:f.name,tamanho:(f.size/1024).toFixed(1)+"KB"}); }} />

            <div style={{display:"flex",gap:10}}>
              <button style={{...btnGhost,flex:1}} onClick={()=>setModal(null)}>Cancelar</button>
              <button style={{...btnBlue,flex:2}} onClick={()=>{
                if(modalTxt) setJustifDoc(p=>({...p,[modal]:modalTxt}));
                if(modalAcao) setAcaoDoc(p=>({...p,[modal]:modalAcao}));
                if(modalAnexo) setAnexoDoc(p=>({...p,[modal]:modalAnexo}));
                setModal(null);
              }}>Salvar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   TAB — HISTÓRICO
══════════════════════════════════════════════════════════════ */
function TabHistorico() {
  const [busca, setBusca] = useState("");
  // histórico fictício para demonstração
  const registros = [];

  return (
    <div className="fade">
      <div style={{...card,marginBottom:14}}>
        <input style={inp()} placeholder="🔎 Buscar por escola, turma, estudante..." value={busca} onChange={e=>setBusca(e.target.value)} />
      </div>
      {registros.length===0 && (
        <div style={{textAlign:"center",padding:"50px 20px",color:"#4a7fa5"}}>
          <div style={{fontSize:40,marginBottom:10}}>📊</div>
          <div style={{fontWeight:700,marginBottom:4}}>Nenhum registro salvo ainda</div>
          <div style={{fontSize:12}}>Os registros de frequência aparecerão aqui após serem salvos</div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   TAB — ALERTAS
══════════════════════════════════════════════════════════════ */
function TabAlertas() {
  const {alertas, limparAlerta} = React.useContext(AlertasContext);

  return (
    <div className="fade">
      <div style={{...card,background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.25)",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:24}}>🔔</span>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:"#fca5a5"}}>Sistema de Alertas de Faltas</div>
            <div style={{fontSize:11,color:"#4a7fa5",marginTop:2}}>Estudantes com <strong style={{color:"#fbbf24"}}>2 ou mais faltas</strong> aparecem automaticamente aqui</div>
          </div>
        </div>
      </div>

      {alertas.length === 0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:"#4a7fa5"}}>
          <div style={{fontSize:48,marginBottom:12}}>✅</div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Nenhum alerta no momento</div>
          <div style={{fontSize:12}}>Quando um estudante atingir 2 faltas o alerta aparece aqui automaticamente</div>
        </div>
      ) : (
        <div>
          <div style={{fontSize:10,color:"#4a7fa5",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>
            {alertas.length} estudante{alertas.length>1?"s":""} em alerta
          </div>
          {alertas.map(a => (
            <div key={a.id} style={{background:"rgba(239,68,68,.08)",border:"1px solid rgba(239,68,68,.3)",borderLeft:"4px solid #ef4444",borderRadius:10,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"flex-start",gap:12}}>
              <div style={{fontSize:28,flexShrink:0}}>⚠️</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:14,color:"#fca5a5",marginBottom:4}}>{a.estudante}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}}>
                  <span style={{fontSize:11,background:"rgba(239,68,68,.15)",color:"#fca5a5",border:"1px solid rgba(239,68,68,.3)",borderRadius:6,padding:"2px 8px",fontWeight:700}}>
                    🔴 {a.faltas} falta{a.faltas>1?"s":""}
                  </span>
                  <span style={{fontSize:11,background:"rgba(56,189,248,.1)",color:"#7dd3fc",border:"1px solid rgba(56,189,248,.2)",borderRadius:6,padding:"2px 8px"}}>
                    🏫 {a.escola}
                  </span>
                  <span style={{fontSize:11,background:"rgba(167,139,250,.1)",color:"#c4b5fd",border:"1px solid rgba(167,139,250,.2)",borderRadius:6,padding:"2px 8px"}}>
                    📚 {a.ano} — Turma {a.turma}
                  </span>
                  <span style={{fontSize:11,background:"rgba(74,222,128,.1)",color:"#86efac",border:"1px solid rgba(74,222,128,.2)",borderRadius:6,padding:"2px 8px"}}>
                    🕐 {a.turno}
                  </span>
                  <span style={{fontSize:11,background:"rgba(255,255,255,.05)",color:"#4a7fa5",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"2px 8px"}}>
                    📅 {a.data}
                  </span>
                </div>
                <div style={{fontSize:11,color:"#f87171",fontWeight:600}}>
                  ⚠ Estudante atingiu o limite de faltas — recomenda-se acionar a Busca Ativa
                </div>
              </div>
              <button onClick={()=>limparAlerta(a.id)} style={{background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",color:"#fca5a5",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:12,fontWeight:700,flexShrink:0}}>
                Dispensar
              </button>
            </div>
          ))}
          <div style={{marginTop:6}}>
            <button onClick={()=>alertas.forEach(a=>limparAlerta(a.id))} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.25)",color:"#fca5a5",borderRadius:8,padding:"9px 18px",cursor:"pointer",fontSize:12,fontWeight:700}}>
              Dispensar todos os alertas
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

   ROOT

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
